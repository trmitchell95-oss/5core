name: Build ChairKeeper Live

on:
  push:
    paths:
      - '.github/workflows/build-chairkeeper-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-live-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified full ChairKeeper pages
        run: |
          set -euo pipefail
          mkdir -p simply-hope-live-v098
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/XbdYW51EXpZL6w0A' -o simply-hope-live-v098/index.html
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/I8SKiPitgaFA7o1h' -o simply-hope-live-v098/owner.html

          customer_size=$(wc -c < simply-hope-live-v098/index.html)
          owner_size=$(wc -c < simply-hope-live-v098/owner.html)
          echo "customer bytes: $customer_size"
          echo "owner bytes: $owner_size"

          test "$customer_size" -gt 200000
          test "$owner_size" -gt 100000
          grep -qi '<!doctype html' simply-hope-live-v098/index.html
          grep -qi '<!doctype html' simply-hope-live-v098/owner.html
          grep -q 'Simply Hope' simply-hope-live-v098/index.html
          grep -q 'Simply Hope' simply-hope-live-v098/owner.html

      - name: Commit direct pages
        run: |
          git config user.name "ChairKeeper Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add simply-hope-live-v098/index.html simply-hope-live-v098/owner.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish ChairKeeper direct full HTML"
            git push
          fi
